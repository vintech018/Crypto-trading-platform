<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="lightning-mask">
      <!-- White background meaning everything is visible by default -->
      <rect width="200" height="200" fill="white" />
      
      <!-- Black shapes meaning these parts are cut out of the circle -->
      <!-- Main middle lightning bolt (S-curve) -->
      <polygon points="165,30 90,105 130,105 45,165 110,85 70,85" fill="black" />
      
      <!-- Top left cuts -->
      <polygon points="50,90 75,55 55,75 80,75" fill="black" />
      <polygon points="40,110 65,80 45,95 70,95" fill="black" />
      
      <!-- Bottom right cuts -->
      <polygon points="160,95 135,125 155,110 130,110" fill="black" />
      <polygon points="150,115 125,145 145,130 120,130" fill="black" />
    </mask>
  </defs>
  <!-- The main white circle masked by the lightning bolt -->
  <circle cx="100" cy="100" r="85" fill="white" mask="url(#lightning-mask)" />
</svg>
